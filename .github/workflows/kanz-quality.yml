name: Kanz quality and credential gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanz-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format, full analysis, and all local tests
        run: dart tools/quality_gate.dart

  credential-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - name: Reject embedded privileged credentials and signing containers
        run: dart tools/release_security.dart

  android-debug:
    needs: [quality, credential-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Recheck credential gate before creating an APK
        run: dart tools/release_security.dart
      - name: Build only Android debug (no upload or deployment)
        run: flutter build apk --debug --no-pub
